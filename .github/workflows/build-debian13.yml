name: Build Debian 13 Desktop

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本'
        required: true
        type: string
        default: '7.1'

      kernel_channel:
        description: '内核通道'
        required: true
        type: choice
        options:
          - mainline
          - stable
        default: 'mainline'

      desktop_env:
        description: '桌面环境'
        required: true
        type: choice
        options:
          - all
          - gnome
          - kde
        default: 'all'

      boot_mode:
        description: '启动模式'
        required: true
        type: choice
        options:
          - all
          - dual
          - single
        default: 'all'

      skip_release:
        description: '跳过创建GitHub Release'
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
      - master
    paths:
      - 'sheng-rootfs_build.sh'
      - 'lib/rootfs-common.sh'
      - '.github/workflows/build-debian13.yml'
      - '.github/workflows/_rootfs-template.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_rootfs-template.yml

    with:
      distro: debian-desktop
      script: sheng-rootfs_build.sh

      kernel_version_default: ${{ inputs.kernel_version || '7.1' }}

      desktop_env: ${{ inputs.desktop_env || 'all' }}
      boot_mode: ${{ inputs.boot_mode || 'all' }}

      desktop_matrix: '["all"]'
      boot_matrix: '["all"]'

      release_tag_prefix: debian13
      release_body_title: 'Debian 13 (Trixie) Desktop'

      skip_release: ${{ inputs.skip_release || false }}

    secrets: inherit
